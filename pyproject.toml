[project]
name = "asteroids"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.7"
dependencies = [
    "pygame==2.6.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.5",
    "ty>=0.0.77",
]
[build-system]
requires= ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
asteroids = "asteroids.__main__:main"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
